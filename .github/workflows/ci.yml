name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway key for the tests only; the real one lives in .env on the server
      SECRET_KEY: ci-only-not-a-secret
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Each test creates its own temporary database in the working directory
      - name: Tests
        working-directory: ${{ runner.temp }}
        run: |
          for t in test_consumption test_energy test_unit_sync test_access test_login_limit test_invite_flow; do
            echo "::group::$t"
            python "$GITHUB_WORKSPACE/backend/tests/$t.py"
            echo "::endgroup::"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      # Includes the TypeScript check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
