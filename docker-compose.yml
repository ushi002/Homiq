services:
  backend:
    build: ./backend
    # ports:
    #   - "8000:8000" # Exposed via Nginx
    volumes:
      - ./backend/database.db:/app/database.db
    environment:
      - INFLUX_HOST=${INFLUX_HOST:-http://host.docker.internal:8086}
      - INFLUX_USER=${INFLUX_USER:-alarmread}
      - INFLUX_PASSWORD=${INFLUX_PASSWORD}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - SQL_ECHO=${SQL_ECHO:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?PUBLIC_URL must be set in .env}/api
    # ports:
    #   - "3000:3000" # Exposed via Nginx
    environment:
      - NEXT_PUBLIC_API_URL=${PUBLIC_URL}/api
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always
